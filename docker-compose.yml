version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sup
      POSTGRES_USER: sup
      POSTGRES_PASSWORD: sup
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sup"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sup-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sup-network

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://sup:sup@postgres:5432/sup
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sup-network

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - backend
    networks:
      - sup-network

  bot:
    build: ./bot
    env_file:
      - .env
    environment:
      BACKEND_URL: http://backend:8000
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - backend
      - redis
    networks:
      - sup-network

volumes:
  postgres-data:

networks:
  sup-network:
    driver: bridge
